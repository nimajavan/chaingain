name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - name: Compile contracts
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run contracts:compile 2>&1 | tee contracts-compile.log
          status=${PIPESTATUS[0]}
          {
            echo '### Solidity compile output'
            echo '```text'
            tail -n 120 contracts-compile.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            node -e "const fs=require('node:fs'); const value=fs.readFileSync('contracts-compile.log','utf8').slice(-5000).replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A'); console.log('::error title=Solidity compile failed::'+value)"
          fi
          exit "$status"
      - run: npm run contracts:test
      - run: npm run test
      - run: npm audit --omit=dev --audit-level=high
